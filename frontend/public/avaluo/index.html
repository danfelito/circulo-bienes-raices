function statusClass(status){

  if(['Análisis de mercado','Cálculo'].includes(status)) return 'purple';
  if(['Documentos pendientes','Inspección pendiente','Requiere revisión'].includes(status)) return 'warning';
  return 'neutral';
}

function dashboard(){

  return `<section><div class="heading"><div><span class="eyebrow">Centro de trabajo</span><h1>Expedientes de valuación</h1><p>Organiza documentos, evidencia y decisiones técnicas en un expediente trazable.</p></div>${btn('＋ Nueva valuación','primary','data-action="new-case"')}</div>

}
function metric(symbol,label,value,delta){return `<article class="metric"><span>${symbol}</span><div><small>${label}</small><strong>${value}</strong><em>${delta}</em></div></article>`;}

function caseWorkspace(){

  const nav=tabs.map(([name,key])=>`<button data-case-tab="${name}" class="${state.tab===name?'active':''}">${icon(key)} ${name}${name==='Resumen'?'<b>4</b>':name==='Documentos'?'<b>2</b>':''}</button>`).join('');
  let inner='';
  if(state.tab==='Resumen') inner=summary(c);
  if(state.tab==='Documentos') inner=documentModule();

  if(['Inspección','Entorno','Mercado','Cálculos','Resultado','Informe'].includes(state.tab)) inner=futureModule(state.tab);
  return `<section><button class="back" data-action="dashboard">← Expedientes</button><div class="case-title"><div><div class="meta"><span>${c.folio}</span><span class="pill ${statusClass(c.status)}">${c.status}</span></div><h1>${c.type}</h1><p>◎ ${c.address}, ${c.city}</p></div><div class="actions">${btn('••• Acciones')}${btn('✓ Guardado','primary')}</div></div><div class="case-progress"><div><span>Progreso general</span><strong>${c.progress} %</strong></div><div class="progress large"><i style="width:${c.progress}%"></i></div><div class="next"><b>◷ Siguiente acción:</b> resolver diferencias de superficie y confirmar folio registral.</div></div><div class="workspace"><aside class="case-nav">${nav}</aside><div>${inner}</div></div></section>`;

  const list=documents.map((d,i)=>`<button class="doc-row ${state.selectedDoc===i?'active':''}" data-doc-index="${i}"><span class="file">▤</span><div><strong>${d.name}</strong><small>${d.type} · ${d.pages} pág. · ${d.date}</small></div><span class="pill ${statusClass(d.status)}">${d.status}</span><span>•••</span></button>`).join('');
  const d=documents[state.selectedDoc];
  return `<div class="document-layout"><article class="card no-top"><div class="drop"><b>⇧</b><strong>Arrastra documentos aquí</strong><small>PDF, JPG, PNG, DOCX o XLSX · máximo 25 MB</small>${btn('Seleccionar archivos')}</div><div class="doc-list">${list}</div></article><aside class="card viewer no-top"><div class="viewer-head"><div><strong>${d.name}</strong><small>Página 1 de ${d.pages}</small></div><span>•••</span></div><div class="paper"><small>NOTARÍA PÚBLICA</small><h4>ESCRITURA DE PROPIEDAD</h4><p>En la ciudad de Boca del Río, Veracruz, comparece la C. <mark>MARÍA GONZÁLEZ HERNÁNDEZ</mark> en carácter de propietaria...</p><p>El inmueble se identifica con la clave catastral <mark>30-193-014-001-042</mark> y una superficie total de <mark>512,40 m²</mark>.</p><div class="paper-lines"></div><em>Firma y sello</em></div><div class="viewer-info"><div><small>Clasificación</small><strong>${d.type}</strong></div><div><small>Confianza</small><strong>${d.confidence} %</strong></div><div><small>Estado</small><strong>${d.status}</strong></div></div></aside></div>`;
}
function fieldsView(){return `<div class="field-list">${fields.map((f,i)=>`<article class="card field no-top"><div class="field-grid"><div><strong>${f.label}</strong><small>${f.source} · Página ${f.page}</small></div><div><input data-field-value="${i}" value="${escapeHtml(f.value)}"><button class="link" data-restore-field="${i}">Restaurar original</button></div><div><span>Confianza <b>${f.confidence} %</b></span><div class="confidence"><i style="width:${f.confidence}%"></i></div></div><button class="btn ${f.confirmed?'confirmed':'secondary'}" data-confirm-field="${i}">${f.confirmed?'✓ Confirmado':'Confirmar dato'}</button></div><details><summary>Ver evidencia original</summary><blockquote>${f.evidence}</blockquote><small>Texto original: ${f.original}</small></details></article>`).join('')}</div>`;}
function conflictsView(){
  const heads=['Dato','Escritura','Catastro','Predial','Plano','Medición','Dato adoptado'];
  return `<article class="card no-top"><div class="card-head"><div><h3>Conciliación documental</h3><p>Compara las fuentes y define el dato que utilizará el expediente.</p></div><span class="pill warning">2 conflictos relevantes</span></div><div class="table-wrap"><table class="compare"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${conflicts.map((r,ri)=>`<tr><td><strong>${r.field}</strong><em class="severity-label ${r.severity.toLowerCase()}">${r.severity}</em></td>${r.values.map((v,vi)=>`<td><button class="source ${v===r.adopted?'selected':''}" data-conflict-row="${ri}" data-conflict-value="${escapeHtml(v)}">${v}</button></td>`).join('')}<td><input data-adopted="${ri}" value="${escapeHtml(r.adopted)}"></td></tr>`).join('')}</tbody></table></div><div id="justification"></div></article>`;
}
function alertsView(){return `<div class="alert-list-detail">${alerts.map((a,i)=>`<article class="card alert-detail no-top ${a.resolved?'resolved':''}"><span class="severity ${a.severity.toLowerCase()}">!</span><div><div><em class="severity-label ${a.severity.toLowerCase()}">${a.severity}</em><strong>${a.title}</strong></div><p>${a.detail}</p><small><b>Acción recomendada:</b> ${a.recommendation}</small><small>Responsable: ${a.owner}</small></div><button class="btn ${a.resolved?'confirmed':'secondary'}" data-resolve-alert="${i}">${a.resolved?'✓ Resuelta':'Marcar resuelta'}</button></article>`).join('')}</div>`;}

function propertyForm(){return `<div class="stack"><div class="section-head"><div><span class="eyebrow">Características físicas</span><h2>Datos del inmueble</h2><p>Información adoptada para el análisis, separada de los valores originales.</p></div><button class="btn confirmed" id="save-property">✓ Guardado</button></div>${formSection(1,'Identificación y uso','Clasificación principal del activo',`<label>Tipo de inmueble<select><option>Casa habitación</option><option>Departamento</option><option>Terreno urbano</option></select></label><label>Uso actual<select><option>Habitacional</option><option>Comercial</option><option>Mixto</option></select></label><label>Estado de ocupación<select><option>Habitado por propietario</option><option>Arrendado</option><option>Desocupado</option></select></label>`,'three')}${formSection(2,'Terreno','Dimensiones, geometría, topografía y acceso',`<label>Superficie adoptada<div class="unit"><input value="512,40"><span>m²</span></div><small class="warn-text">Diferencia documental pendiente</small></label><label>Frente<div class="unit"><input value="14,50"><span>m</span></div></label><label>Fondo<div class="unit"><input value="35,34"><span>m</span></div></label><label>Forma<select><option>Regular</option><option>Irregular</option></select></label><label>Topografía<select><option>Plana</option><option>Semiplana</option></select></label><label>Nivel respecto a calle<select><option>Al mismo nivel</option><option>Superior</option></select></label><label>Acceso<select><option>Vialidad pavimentada</option><option>Terracería</option></select></label><label>Orientación<select><option>Noreste</option><option>Norte</option><option>Sur</option></select></label>`,'four')}${formSection(3,'Construcción','Área, edad, distribución y calidad',`<label>Superficie construida<div class="unit"><input value="238,00"><span>m²</span></div><small class="danger-text">Posible ampliación no registrada</small></label><label>Antigüedad aparente<div class="unit"><input value="16"><span>años</span></div></label><label>Niveles<input type="number" value="2"></label><label>Calidad constructiva<select><option>Media superior</option><option>Media</option><option>Residencial</option></select></label><label>Habitaciones<input type="number" value="4"></label><label>Baños<input type="number" value="3"></label><label>Estacionamientos<input type="number" value="2"></label><label>Conservación<select><option>Buena</option><option>Muy buena</option><option>Regular</option></select></label>`,'four')}${formSection(4,'Servicios y equipamiento','Selecciona únicamente lo verificado',`<div class="checkboxes">${['Agua potable','Drenaje','Energía eléctrica','Internet','Gas estacionario','Cisterna','Climatización','Seguridad privada','Jardín','Alberca','Paneles solares','Elevador'].map((x,i)=>`<label><input type="checkbox" ${i<8?'checked':''}><span>✓</span>${x}</label>`).join('')}</div>`,'one')}</div>`;}
function formSection(n,title,desc,content,cols){return `<article class="card form no-top"><div class="form-title"><span>${n}</span><div><h3>${title}</h3><p>${desc}</p></div></div><div class="form-grid ${cols}">${content}</div></article>`;}
function historyView(){return `<div class="stack"><div class="section-head"><div><span class="eyebrow">Trazabilidad</span><h2>Historial de cambios</h2><p>Registro inmutable de decisiones, correcciones y cargas documentales.</p></div>${btn('☷ Filtrar')}</div><article class="card timeline no-top">${audit.map((e,i)=>`<div class="event"><div class="dot">${i===0?'▧':'↺'}</div><div><div class="event-head"><strong>${e.action}</strong><span>${e.date}</span></div><small>${e.user}</small>${e.previous?`<div class="change"><s>${e.previous}</s><span>›</span><b>${e.current}</b></div>`:`<div class="single">${e.current}</div>`}${e.reason?`<blockquote>${e.reason}</blockquote>`:''}</div></div>`).join('')}</article></div>`;}

function futureModule(tab){
 const data={Inspección:['✓','Inspección móvil guiada','Registro de evidencia física con GPS, fotografías obligatorias, mediciones y firma del inspector.',['Lista adaptable por inmueble','Trabajo sin conexión','Validación de ubicación y fecha']],Entorno:['◎','Análisis territorial','Geolocalización, servicios, riesgos, vialidades y paquete regional aplicable.',['Mapas y polígonos','Riesgos documentados','Indicadores de entorno']],Mercado:['▥','Base de comparables','Captura, importación, verificación y calificación de evidencia de mercado.',['Ofertas y cierres diferenciados','Detección de duplicados','Puntuación de similitud']],Cálculos:['∑','Motor valuatorio','Métodos reproducibles de mercado, costos, ingresos y residual.',['Fórmulas versionadas','Homologación transparente','Análisis de sensibilidad']],Resultado:['◈','Reconciliación y confianza','Rango de valor, ponderación por método, calidad de datos e incertidumbre.',['Valor central y rango','Índice de confianza','Factores positivos y negativos']],Informe:['▧','Informe profesional','Generación de PDF verificable con anexos, auditoría, revisión y firma.',['Plantillas por finalidad','Código de verificación','Control de versiones']]};
 const [sym,title,desc,items]=data[tab]; return `<article class="future"><span>${sym}</span><small class="eyebrow">Próximo módulo</small><h2>${title}</h2><p>${desc}</p><div>${items.map(x=>`<em>✓ ${x}</em>`).join('')}</div><b>◷ Preparado en la arquitectura del proyecto</b></article>`;
}

function newCase(){
  const w=state.wizard;
  const stepper=[['Finalidad','Tipo y propósito'],['Inmueble','Ubicación y fecha'],['Responsables','Solicitante y propietario']].map((x,i)=>`<div class="step ${state.wizardStep>=i+1?'active':''}"><span>${state.wizardStep>i+1?'✓':i+1}</span><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${i<2?'<i></i>':''}</div>`).join('');
  let form='';
  if(state.wizardStep===1) form=`<h2>¿Qué se va a analizar?</h2><p>Esta selección define los formularios y controles metodológicos.</p><div class="form-grid two"><label>Finalidad<select data-wizard="purpose"><option>Estimación de valor comercial</option><option>Estudio de mercado</option><option>Compra / negociación</option><option>Análisis de renta</option><option>Preavalúo técnico</option></select></label><label>Tipo de inmueble<select data-wizard="propertyType"><option>Casa habitación</option><option>Departamento</option><option>Terreno urbano</option><option>Local comercial</option><option>Bodega</option><option>Oficina</option><option>Finca rural</option></select></label></div>`;
  if(state.wizardStep===2) form=`<h2>Ubicación del inmueble</h2><p>La plataforma acepta cualquier zona; el resultado indicará el nivel de cobertura disponible.</p><div class="form-grid two"><label>País<select data-wizard="country"><option>México</option><option>Colombia</option><option>España</option><option>Otro</option></select></label><label>Ciudad o municipio<input data-wizard="city" value="${escapeHtml(w.city)}" placeholder="Ej. Boca del Río, Veracruz"></label><label class="full">Dirección<input data-wizard="address" value="${escapeHtml(w.address)}" placeholder="Calle, número, colonia o referencia"></label><label>Fecha de valor<input type="date" data-wizard="date" value="${w.date}"></label><label>Moneda<select data-wizard="currency"><option>MXN</option><option>COP</option><option>EUR</option><option>USD</option></select></label></div>`;
  if(state.wizardStep===3) form=`<h2>Responsables del expediente</h2><p>Estos datos podrán vincularse con usuarios y organizaciones verificadas posteriormente.</p><div class="form-grid two"><label>Solicitante<input data-wizard="applicant" value="${escapeHtml(w.applicant)}" placeholder="Persona u organización"></label><label>Propietario declarado<input data-wizard="owner" value="${escapeHtml(w.owner)}" placeholder="Nombre completo o razón social"></label></div><div class="review"><strong>Resumen inicial</strong><div><span>${w.propertyType}</span><span>${w.purpose}</span><span>${w.address||'Dirección pendiente'}, ${w.city||'Ciudad pendiente'}</span><span>${w.country} · ${w.currency}</span></div></div>`;
  return `<section class="wizard"><button class="back" data-action="dashboard">← Cancelar</button><div class="wizard-head"><span class="eyebrow">Nuevo expediente</span><h1>Crear valuación</h1><p>Configura la finalidad, ubicación y responsables. Podrás completar los demás datos después.</p></div><div class="stepper">${stepper}</div><article class="card wizard-card">${form}<div class="wizard-actions"><button class="btn secondary" data-wizard-back ${state.wizardStep===1?'disabled':''}>Anterior</button>${state.wizardStep<3?'<button class="btn primary" data-wizard-next>Continuar ›</button>':'<button class="btn primary" data-create-case>＋ Crear expediente</button>'}</div></article></section>`;
}

function settings(){return `<section><div class="heading"><div><span class="eyebrow">Administración</span><h1>Configuración</h1><p>Preferencias de organización, roles y cobertura territorial.</p></div></div><div class="settings-grid">${settingCard('♙','Perfil profesional','Nombre, especialidad, credenciales y firma.','Abrir perfil')}${settingCard('♙','Organización','Miembros, estructura y permisos de acceso.','Administrar')}${settingCard('✓','Roles y permisos','Control granular de lectura, edición, aprobación y firma.','Solo lectura')}<article class="card no-top setting-card"><span class="setting-icon">◫</span><h3>Paquetes regionales</h3><p>Moneda, normativa, costos, catastro y fuentes locales.</p><div class="region"><b>MX</b><div><strong>México · Veracruz</strong><small>Calibración inicial activa</small></div><span class="pill success">Activo</span></div><div class="region"><b>CO</b><div><strong>Colombia · Cundinamarca</strong><small>Configuración exploratoria</small></div><span class="pill neutral">Preparado</span></div></article></div></section>`;}
function settingCard(sym,title,desc,action){return `<article class="card no-top setting-card"><span class="setting-icon">${sym}</span><h3>${title}</h3><p>${desc}</p>${btn(action)}</article>`;}

function bind(){
  document.querySelectorAll('[data-action="dashboard"]').forEach(el=>el.onclick=()=>{state.view='dashboard';render();});
  document.querySelectorAll('[data-action="new-case"]').forEach(el=>el.onclick=()=>{state.view='new';state.wizardStep=1;render();});
  document.querySelectorAll('[data-action="settings"]').forEach(el=>el.onclick=()=>{state.view='settings';render();});
  const theme=document.querySelector('[data-action="theme"]'); if(theme) theme.onclick=()=>{state.dark=!state.dark;render();};
  const global=document.getElementById('global-search'); if(global) global.oninput=e=>{state.search=e.target.value;if(state.view==='dashboard')render();};
  const search=document.getElementById('case-search'); if(search) search.oninput=e=>{state.search=e.target.value;render();};
  const role=document.getElementById('role-select'); if(role) role.onchange=e=>{state.role=e.target.value;};
  document.querySelectorAll('[data-open-case]').forEach(el=>el.onclick=()=>{state.selectedCase=el.dataset.openCase;state.view='case';state.tab='Resumen';render();});
  document.querySelectorAll('[data-case-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.caseTab;render();});
  document.querySelectorAll('[data-doc-tab]').forEach(el=>el.onclick=()=>{state.docTab=el.dataset.docTab;render();});
  document.querySelectorAll('[data-doc-index]').forEach(el=>el.onclick=()=>{state.selectedDoc=Number(el.dataset.docIndex);render();});
  document.querySelectorAll('[data-confirm-field]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.confirmField);fields[i].confirmed=!fields[i].confirmed;render();});
  document.querySelectorAll('[data-restore-field]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.restoreField);fields[i].value=fields[i].original;render();});
  document.querySelectorAll('[data-field-value]').forEach(el=>el.onchange=e=>{fields[Number(el.dataset.fieldValue)].value=e.target.value;});
  document.querySelectorAll('[data-resolve-alert]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.resolveAlert);alerts[i].resolved=!alerts[i].resolved;render();});
  document.querySelectorAll('[data-conflict-row]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.conflictRow);conflicts[i].adopted=el.dataset.conflictValue;render();setTimeout(showJustification,0);});
  document.querySelectorAll('[data-adopted]').forEach(el=>el.onchange=e=>{conflicts[Number(el.dataset.adopted)].adopted=e.target.value;showJustification();});
  const upload=document.querySelector('[data-action="upload"]'); if(upload) upload.onclick=()=>{upload.textContent='Procesando...';setTimeout(()=>{upload.textContent='✓ Documento procesado';},900);};
  document.querySelectorAll('.form input,.form select').forEach(el=>el.onchange=()=>{const save=document.getElementById('save-property');if(save){save.className='btn primary';save.textContent='Guardar cambios';save.onclick=()=>{save.className='btn confirmed';save.textContent='✓ Guardado';};}});
  document.querySelectorAll('[data-wizard]').forEach(el=>{const key=el.dataset.wizard;el.value=state.wizard[key]||el.value;el.oninput=e=>{state.wizard[key]=e.target.value;if(key==='country'){state.wizard.currency=e.target.value==='Colombia'?'COP':e.target.value==='España'?'EUR':'MXN';}};});
  const back=document.querySelector('[data-wizard-back]');if(back)back.onclick=()=>{state.wizardStep--;render();};
  const next=document.querySelector('[data-wizard-next]');if(next)next.onclick=()=>{state.wizardStep++;render();};
  const create=document.querySelector('[data-create-case]');if(create)create.onclick=createCase;
}

function showJustification(){
  const box=document.getElementById('justification');if(!box)return;
  box.innerHTML=`<div class="justify"><span>!</span><div><strong>Justificación obligatoria</strong><p>Describe por qué se adopta este valor y qué evidencia lo respalda.</p><textarea id="reason" placeholder="Ejemplo: se prioriza la escritura por contener medidas y colindancias..."></textarea></div><button class="btn primary" id="save-reason" disabled>Registrar decisión</button></div>`;
  const reason=document.getElementById('reason'),save=document.getElementById('save-reason');reason.oninput=()=>save.disabled=!reason.value.trim();save.onclick=()=>{box.innerHTML='<div class="saved-note">✓ Decisión registrada en el historial de auditoría.</div>';};
}
function createCase(){
 const w=state.wizard;if(!w.city||!w.address||!w.applicant||!w.owner){alert('Completa ciudad, dirección, solicitante y propietario.');return;}
 const id='case-'+Date.now();cases.unshift({id,folio:'VAL-2026-'+String(Math.floor(Math.random()*800)+100).padStart(4,'0'),type:w.propertyType,address:w.address,city:w.city,country:w.country,purpose:w.purpose,owner:w.owner,applicant:w.applicant,date:w.date,currency:w.currency,status:'Borrador',progress:12,alerts:0,updated:'Ahora',coverage:'Asistida'});state.selectedCase=id;state.view='case';state.tab='Resumen';render();
}

render();
</script></body>
</html>
