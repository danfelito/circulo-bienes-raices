name: Validate application and Docker deploy

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schema and generate client
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: Check backend JavaScript syntax
        run: |
          find backend/src backend/prisma -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag circulo-bienes-raices:test .

  live-smoke:
    name: Check current Render services
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12

    steps:
      - name: Test active website, API and connected portal
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local destination="$2"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 12 \
              --connect-timeout 20 --max-time 120 \
              --output "${destination}" "${url}"
          }

          fetch "https://circulo-bienes-raices-1.onrender.com/" /tmp/home.html
          grep -qi "Círculo Internacional" /tmp/home.html

          fetch "https://circulo-bienes-raices-1.onrender.com/propiedades" /tmp/properties.html
          grep -qi "Círculo Internacional" /tmp/properties.html

          fetch "https://circulo-bienes-raices-1.onrender.com/admin/login" /tmp/login.html
          grep -qi "Círculo Internacional" /tmp/login.html

          fetch "https://circulo-bienes-raices-1.onrender.com/api/properties?limit=1" /tmp/properties.json
          python - <<'PY'
          import json
          with open('/tmp/properties.json', encoding='utf-8') as response:
              payload = json.load(response)
          assert isinstance(payload.get('properties'), list)
          assert isinstance(payload.get('pagination'), dict)
          print('Public property API returned valid JSON')
          PY

          fetch "https://circulo-inmobiliario.onrender.com/" /tmp/search-portal.html
          grep -qi "Círculo" /tmp/search-portal.html
