name: Validate application and Docker deploy

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schema and generate client
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: Check backend JavaScript syntax
        run: |
          find backend/src backend/prisma -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag circulo-bienes-raices:test .

  live-smoke:
    name: Check current Render services
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12

    steps:
      - name: Test active website, API and connected portal
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          fetch() {
            local url="$1"
            local destination="$2"
            local headers="$3"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 12 \
              --connect-timeout 20 --max-time 120 \
              --dump-header "${headers}" \
              --output "${destination}" "${url}"
          }

          check_html() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local slug="$4"
            if fetch "${url}" "/tmp/${slug}.html" "/tmp/${slug}.headers" && grep -qi "${expected}" "/tmp/${slug}.html"; then
              echo "PASS: ${label}"
            else
              echo "FAIL: ${label}"
              failures=$((failures + 1))
            fi
          }

          check_html "Main homepage" "https://circulo-bienes-raices-1.onrender.com/" "Círculo Internacional" home
          check_html "Property catalog route" "https://circulo-bienes-raices-1.onrender.com/propiedades" "Círculo Internacional" properties
          check_html "Admin login route" "https://circulo-bienes-raices-1.onrender.com/admin/login" "Círculo Internacional" login

          if fetch "https://circulo-bienes-raices-1.onrender.com/api/properties?limit=1" /tmp/properties.json /tmp/api.headers; then
            echo "API response headers:"
            grep -iE '^(HTTP/|content-type:)' /tmp/api.headers || true
            echo "API response preview:"
            head -c 240 /tmp/properties.json || true
            echo
            if python - <<'PY'
          import json
          with open('/tmp/properties.json', encoding='utf-8-sig') as response:
              payload = json.load(response)
          assert isinstance(payload.get('properties'), list)
          assert isinstance(payload.get('pagination'), dict)
          print('PASS: Public property API returned valid JSON')
          PY
            then
              true
            else
              echo "FAIL: Public property API did not return the expected JSON contract"
              failures=$((failures + 1))
            fi
          else
            echo "FAIL: Public property API was unreachable"
            failures=$((failures + 1))
          fi

          check_html "Connected search portal" "https://circulo-inmobiliario.onrender.com/" "Círculo" search-portal

          if (( failures > 0 )); then
            echo "Smoke test completed with ${failures} failure(s)."
            exit 1
          fi

          echo "All live smoke tests passed."
